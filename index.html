<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スーパーまるばつゲーム</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            background-color: #f0f2f5; margin: 0; padding: 20px;
        }
        #menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
        .menu-btn {
            width: 250px; padding: 15px; margin: 10px; font-size: 18px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 8px; background-color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .menu-btn:hover { background-color: #e0e0e0; transform: translateY(-2px); }
        .pve { border-left: 8px solid #d32f2f; }
        #game-container { display: none; flex-direction: column; align-items: center; }
        #status { font-size: 20px; font-weight: bold; margin-bottom: 15px; height: 30px; color: #333; }
        #ultimate-board {
            display: grid; grid-template-columns: repeat(3, 160px); grid-template-rows: repeat(3, 160px);
            gap: 8px; background-color: #444; padding: 8px; border-radius: 4px;
        }
        .big-cell {
            display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px);
            gap: 2px; background-color: #fff; position: relative; width: 160px; height: 160px; padding: 2px;
        }
        .active-board { background-color: #fff9c4 !important; outline: 3px solid #ffeb3b; z-index: 1; }
        .small-cell {
            width: 50px; height: 50px; background-color: #ffffff; border: 1px solid #ddd;
            display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; cursor: pointer;
        }
        .won-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; font-size: 100px; font-weight: bold;
            background-color: rgba(255, 255, 255, 0.85); pointer-events: none; z-index: 2;
        }
        .won-overlay.O { color: #1976d2; }
        .won-overlay.X { color: #d32f2f; }
        .controls { margin-top: 20px; }
        .btn-small { padding: 8px 16px; margin: 0 5px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>スーパーまるばつゲーム</h1>
        <button class="menu-btn pve" onclick="startGame('PvE')">AI戦 (強め)</button>
        <button class="menu-btn" style="border-left: 8px solid #1976d2;" onclick="startGame('PvP')">対人戦</button>
    </div>

    <div id="game-container">
        <div id="status"></div>
        <div id="ultimate-board"></div>
        <div class="controls">
            <button class="btn-small" onclick="backToMenu()">戻る</button>
            <button class="btn-small" onclick="resetGame()">リセット</button>
        </div>
    </div>

    <script>
        const WIN_PATTERNS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        const PREFERENCE_ORDER = [4, 0, 2, 6, 8, 1, 3, 5, 7]; // 中央 -> 四隅 -> その他
        let smallBoards, bigBoard, currentPlayer, activeBigBoardIndex, gameOver, gameMode;

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            initGame();
        }

        function backToMenu() {
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('game-container').style.display = 'none';
        }

        function initGame() {
            smallBoards = Array(9).fill(null).map(() => Array(9).fill(null));
            bigBoard = Array(9).fill(null);
            currentPlayer = 'O';
            activeBigBoardIndex = -1;
            gameOver = false;
            renderBoard();
            updateStatus();
        }

        function renderBoard() {
            const boardElement = document.getElementById('ultimate-board');
            boardElement.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const bigCell = document.createElement('div');
                bigCell.className = 'big-cell';
                if (!gameOver && (activeBigBoardIndex === -1 || activeBigBoardIndex === i) && bigBoard[i] === null) {
                    bigCell.classList.add('active-board');
                }
                for (let j = 0; j < 9; j++) {
                    const smallCell = document.createElement('div');
                    smallCell.className = 'small-cell';
                    smallCell.textContent = smallBoards[i][j] || '';
                    smallCell.onclick = () => handleMove(i, j);
                    bigCell.appendChild(smallCell);
                }
                if (bigBoard[i]) {
                    const overlay = document.createElement('div');
                    overlay.className = `won-overlay ${bigBoard[i]}`;
                    overlay.textContent = bigBoard[i] === 'Draw' ? '=' : bigBoard[i];
                    bigCell.appendChild(overlay);
                }
                boardElement.appendChild(bigCell);
            }
        }

        function handleMove(bigIndex, smallIndex) {
            if (gameOver || bigBoard[bigIndex] !== null || smallBoards[bigIndex][smallIndex] !== null) return;
            if (activeBigBoardIndex !== -1 && activeBigBoardIndex !== bigIndex) return;

            executeMove(bigIndex, smallIndex);
            if (!gameOver && gameMode === 'PvE' && currentPlayer === 'X') {
                setTimeout(aiSmartMove, 500);
            }
        }

        function executeMove(bigIndex, smallIndex) {
            smallBoards[bigIndex][smallIndex] = currentPlayer;
            if (checkWin(smallBoards[bigIndex], currentPlayer)) {
                bigBoard[bigIndex] = currentPlayer;
            } else if (!smallBoards[bigIndex].includes(null)) {
                bigBoard[bigIndex] = 'Draw';
            }

            if (checkWin(bigBoard, currentPlayer)) {
                gameOver = true;
                renderBoard();
                document.getElementById('status').textContent = `🏆 ${currentPlayer} の勝利です！`;
                return;
            }

            activeBigBoardIndex = (bigBoard[smallIndex] === null) ? smallIndex : -1;
            currentPlayer = currentPlayer === 'O' ? 'X' : 'O';
            updateStatus();
            renderBoard();
        }

        function aiSmartMove() {
            const possibleMoves = [];
            const searchIndices = activeBigBoardIndex === -1 
                ? bigBoard.map((v, i) => v === null ? i : null).filter(v => v !== null)
                : [activeBigBoardIndex];

            for (let bIdx of searchIndices) {
                for (let sIdx = 0; sIdx < 9; sIdx++) {
                    if (smallBoards[bIdx][sIdx] === null) {
                        possibleMoves.push({ bIdx, sIdx, score: evaluateMove(bIdx, sIdx) });
                    }
                }
            }

            // スコアが高い順にソートして、最も良い手を選択
            possibleMoves.sort((a, b) => b.score - a.score);
            const bestMove = possibleMoves[0];
            executeMove(bestMove.bIdx, bestMove.sIdx);
        }

        function evaluateMove(bIdx, sIdx) {
            let score = 0;
            // 1. その手で大きなマスを獲得できる（最優先）
            const tempBoard = [...smallBoards[bIdx]];
            tempBoard[sIdx] = 'X';
            if (checkWin(tempBoard, 'X')) score += 100;

            // 2. 相手のリーチを阻止する
            const tempBoardOpp = [...smallBoards[bIdx]];
            tempBoardOpp[sIdx] = 'O';
            if (checkWin(tempBoardOpp, 'O')) score += 50;

            // 3. 次に相手がどこでも打てる（フリー）状態にするのを避ける
            if (bigBoard[sIdx] !== null) score -= 40;

            // 4. マスの重要度（中央 > 角）
            score += (8 - PREFERENCE_ORDER.indexOf(sIdx));

            return score;
        }

        function checkWin(board, player) {
            return WIN_PATTERNS.some(p => p.every(idx => board[idx] === player));
        }

        function updateStatus() {
            if (gameOver) return;
            const playerLabel = currentPlayer === 'O' ? '◯ (あなた)' : '× (AI)';
            document.getElementById('status').textContent = `${playerLabel} の番です...`;
        }

        function resetGame() { initGame(); }
    </script>
</body>
</html>
