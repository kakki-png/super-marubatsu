<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スーパーまるばつゲーム</title>
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="./manifest.json">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            background-color: #f0f2f5; margin: 0; padding: 10px;
            touch-action: manipulation; /* ズーム防止 */
            overflow-x: hidden;
        }

        #status {
            font-size: 16px; font-weight: bold; margin: 15px 0;
            height: 30px; color: #333; text-align: center;
        }

        /* 盤面全体のコンテナ：画面幅に合わせて伸縮 */
        #ultimate-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 110px); /* 初期高さ */
            gap: 6px;
            background-color: #444;
            padding: 6px;
            border-radius: 8px;
            width: 95vw;
            max-width: 450px;
            /* 高さを幅と同じにする魔法の1行 */
            aspect-ratio: 1 / 1;
        }

        /* 小さな3x3の盤面 */
        .big-cell {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            background-color: #fff;
            position: relative;
        }

        /* 次に打てる盤面の強調 */
        .active-board {
            background-color: #fff9c4 !important;
            box-shadow: inset 0 0 0 3px #ffeb3b;
            z-index: 1;
        }

        /* 各マス：中身に合わせて伸縮 */
        .small-cell {
            background-color: #ffffff;
            display: flex; align-items: center; justify-content: center;
            font-size: min(5vw, 22px);
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #f0f0f0;
        }

        /* 獲得済みマーク */
        .won-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: min(20vw, 100px);
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.85);
            pointer-events: none; z-index: 2;
        }
        .won-overlay.O { color: #1976d2; }
        .won-overlay.X { color: #d32f2f; }

        .controls { margin-top: 20px; display: flex; gap: 10px; }
        .btn-small {
            padding: 10px 20px; font-size: 14px; cursor: pointer;
            border-radius: 20px; border: none; background: #333; color: white;
        }
    </style>
</head>
<body>

    <div id="status">読み込み中...</div>
    <div id="ultimate-board"></div>
    
    <div class="controls">
        <button class="btn-small" onclick="location.reload()">メニューに戻る</button>
        <button class="btn-small" onclick="resetGame()">リセット</button>
    </div>

    <script>
        const WIN_PATTERNS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        const PREFERENCE_ORDER = [4, 0, 2, 6, 8, 1, 3, 5, 7];
        let smallBoards, bigBoard, currentPlayer, activeBigBoardIndex, gameOver, gameMode;

        // モード選択を簡易化（ここではPvE固定にしていますが、必要ならメニューを挟めます）
        gameMode = 'PvE'; 

        function initGame() {
            smallBoards = Array(9).fill(null).map(() => Array(9).fill(null));
            bigBoard = Array(9).fill(null);
            currentPlayer = 'O';
            activeBigBoardIndex = -1;
            gameOver = false;
            renderBoard();
            updateStatus();
        }

        function renderBoard() {
            const boardElement = document.getElementById('ultimate-board');
            boardElement.innerHTML = '';
            // JSで高さを動的に再設定しない（CSSのaspect-ratioに任せる）
            boardElement.style.gridTemplateRows = 'repeat(3, 1fr)'; 

            for (let i = 0; i < 9; i++) {
                const bigCell = document.createElement('div');
                bigCell.className = 'big-cell';
                if (!gameOver && (activeBigBoardIndex === -1 || activeBigBoardIndex === i) && bigBoard[i] === null) {
                    bigCell.classList.add('active-board');
                }

                for (let j = 0; j < 9; j++) {
                    const smallCell = document.createElement('div');
                    smallCell.className = 'small-cell';
                    smallCell.textContent = smallBoards[i][j] || '';
                    smallCell.onclick = () => handleMove(i, j);
                    bigCell.appendChild(smallCell);
                }

                if (bigBoard[i]) {
                    const overlay = document.createElement('div');
                    overlay.className = `won-overlay ${bigBoard[i]}`;
                    overlay.textContent = bigBoard[i] === 'Draw' ? '=' : bigBoard[i];
                    bigCell.appendChild(overlay);
                }
                boardElement.appendChild(bigCell);
            }
        }

        function handleMove(bigIndex, smallIndex) {
            if (gameOver || bigBoard[bigIndex] !== null || smallBoards[bigIndex][smallIndex] !== null) return;
            if (activeBigBoardIndex !== -1 && activeBigBoardIndex !== bigIndex) return;

            executeMove(bigIndex, smallIndex);
            if (!gameOver && gameMode === 'PvE' && currentPlayer === 'X') {
                setTimeout(aiSmartMove, 500);
            }
        }

        function executeMove(bigIndex, smallIndex) {
            smallBoards[bigIndex][smallIndex] = currentPlayer;
            if (checkWin(smallBoards[bigIndex], currentPlayer)) {
                bigBoard[bigIndex] = currentPlayer;
            } else if (!smallBoards[bigIndex].includes(null)) {
                bigBoard[bigIndex] = 'Draw';
            }

            if (checkWin(bigBoard, currentPlayer)) {
                gameOver = true;
                renderBoard();
                document.getElementById('status').textContent = `🏆 ${currentPlayer} の勝利！`;
                return;
            }

            activeBigBoardIndex = (bigBoard[smallIndex] === null) ? smallIndex : -1;
            currentPlayer = currentPlayer === 'O' ? 'X' : 'O';
            updateStatus();
            renderBoard();
        }

        function aiSmartMove() {
            const possibleMoves = [];
            const searchIndices = activeBigBoardIndex === -1 
                ? bigBoard.map((v, i) => v === null ? i : null).filter(v => v !== null)
                : [activeBigBoardIndex];

            for (let bIdx of searchIndices) {
                for (let sIdx = 0; sIdx < 9; sIdx++) {
                    if (smallBoards[bIdx][sIdx] === null) {
                        possibleMoves.push({ bIdx, sIdx, score: evaluateMove(bIdx, sIdx) });
                    }
                }
            }
            possibleMoves.sort((a, b) => b.score - a.score);
            const bestMove = possibleMoves[0];
            executeMove(bestMove.bIdx, bestMove.sIdx);
        }

        function evaluateMove(bIdx, sIdx) {
            let score = 0;
            const tempX = [...smallBoards[bIdx]]; tempX[sIdx] = 'X';
            if (checkWin(tempX, 'X')) score += 100;
            const tempO = [...smallBoards[bIdx]]; tempO[sIdx] = 'O';
            if (checkWin(tempO, 'O')) score += 50;
            if (bigBoard[sIdx] !== null) score -= 40;
            score += (8 - PREFERENCE_ORDER.indexOf(sIdx));
            return score;
        }

        function checkWin(board, player) {
            return WIN_PATTERNS.some(p => p.every(idx => board[idx] === player));
        }

        function updateStatus() {
            if (gameOver) return;
            const label = currentPlayer === 'O' ? 'あなた (◯)' : 'AI (×)';
            document.getElementById('status').textContent = `${label} の番です`;
        }

        function resetGame() { initGame(); }
        
        // Service Worker登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => console.log('SW Registered'));
        }

        initGame();
    </script>
</body>
</html>
